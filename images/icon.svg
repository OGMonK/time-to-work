<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC478"/>
      <stop offset="1" stop-color="#FF6F61"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EE0FF"/>
      <stop offset="1" stop-color="#B78CFF"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- ringing lines -->
  <g fill="none" stroke="#FFF6E5" stroke-width="7" stroke-linecap="round">
    <path d="M34 62 q-8 14 0 28"/>
    <path d="M22 54 q-12 22 0 44"/>
    <path d="M222 62 q8 14 0 28"/>
    <path d="M234 54 q12 22 0 44"/>
  </g>

  <!-- legs -->
  <g stroke="#3B2A4A" stroke-width="9" stroke-linecap="round">
    <line x1="84" y1="200" x2="70" y2="222"/>
    <line x1="172" y1="200" x2="186" y2="222"/>
  </g>

  <!-- bells -->
  <g fill="#FFE08A" stroke="#3B2A4A" stroke-width="8" stroke-linejoin="round">
    <path d="M48 86 a34 34 0 0 1 52 -40 z"/>
    <path d="M208 86 a34 34 0 0 0 -52 -40 z"/>
  </g>
  <rect x="120" y="44" width="16" height="18" rx="4" fill="#3B2A4A"/>

  <!-- body -->
  <circle cx="128" cy="134" r="80" fill="#FFF8EC" stroke="#3B2A4A" stroke-width="9"/>
  <line x1="128" y1="64" x2="128" y2="78" stroke="#3B2A4A" stroke-width="7" stroke-linecap="round"/>

  <!-- face: eyes glancing down-right at the phone -->
  <circle cx="102" cy="124" r="10" fill="#3B2A4A"/>
  <circle cx="148" cy="124" r="10" fill="#3B2A4A"/>
  <circle cx="105" cy="120" r="3.5" fill="#fff"/>
  <circle cx="151" cy="120" r="3.5" fill="#fff"/>
  <ellipse cx="84" cy="146" rx="11" ry="7" fill="#FF9AA2" opacity=".85"/>
  <ellipse cx="168" cy="146" rx="11" ry="7" fill="#FF9AA2" opacity=".85"/>
  <path d="M112 148 q8 9 16 0 q8 9 16 0" fill="none" stroke="#3B2A4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- phone -->
  <g transform="rotate(14 186 186)">
    <rect x="156" y="140" width="60" height="96" rx="12" fill="#3B2A4A"/>
    <rect x="163" y="151" width="46" height="74" rx="6" fill="url(#screen)"/>
    <path d="M179 174 l18 10 l-18 10 z" fill="#fff"/>
    <rect x="178" y="143" width="16" height="4" rx="2" fill="#5C4A6E"/>
  </g>
</svg>
